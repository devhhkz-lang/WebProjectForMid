<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Foodly</title>
<meta name="description" content="Foodly — order your favourite food online.">
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<div id="site-header"></div>

<main class="auth-wrap">
  <section class="auth-card" aria-labelledby="t">
    <a class="brand" href="index.html"><img src="images/logo.svg" alt="" width="40" height="40"><span>Foodly</span></a>
    <h1 id="t">Create account</h1>
    <p class="sub">Order your favourite food in a few taps</p>
    <form id="register-form" novalidate>
      <div class="form-row">
        <div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" autocomplete="given-name" placeholder="John"><span class="error" role="alert"></span></div>
        <div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" autocomplete="family-name" placeholder="Smith"><span class="error" role="alert"></span></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="student@email.com"><span class="error" role="alert"></span></div>
      <div class="form-row">
        <div class="field"><label for="phone">Phone <span class="muted">(optional)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 777 123 45 67"><span class="error" role="alert"></span></div>
        <div class="field"><label for="dob">Date of birth <span class="muted">(optional)</span></label><input id="dob" name="dob" type="date"><span class="error" role="alert"></span></div>
      </div>
      <div class="field">
        <label for="photo">Profile photo <span class="muted">(optional)</span></label>
        <div class="photo-row"><div class="photo-preview" id="photo-preview" aria-hidden="true">👤</div><input id="photo" name="photo" type="file" accept="image/*"></div>
        <span class="error" role="alert"></span>
      </div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"><span class="error" role="alert"></span></div>
      <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat password"><span class="error" role="alert"></span></div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Register</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="login.html">Login</a></p>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
