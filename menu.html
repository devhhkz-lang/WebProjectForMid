<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu — Foodly</title>
<meta name="description" content="Browse the Foodly menu: burgers, pizza, sushi, salads, desserts and drinks.">
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="menu">
<div id="site-header"></div>

<main>
  <div class="container">
    <div class="page-head"><h1>Menu</h1><p class="muted">Find your next favourite dish</p></div>
    <form class="toolbar" id="filters" role="search">
      <div class="field search-field">
        <label for="q">Search</label>
        <div class="search-box"><input id="q" name="q" type="search" placeholder="Burger, pizza, sushi…"><button class="btn btn-primary" type="submit">Search</button></div>
      </div>
      <div class="field"><label for="price">Price</label>
        <select id="price" name="price">
          <option value="all">Any price</option>
          <option value="low">Under 2 500 ₸</option>
          <option value="mid">2 500 – 4 000 ₸</option>
          <option value="high">Over 4 000 ₸</option>
        </select></div>
      <div class="field"><label for="sort">Sort by</label>
        <select id="sort" name="sort">
          <option value="popular">Top rated</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="time">Fastest</option>
        </select></div>
      <button class="btn btn-ghost" type="button" id="reset">Reset</button>
    </form>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
    <p class="result-info" id="count" aria-live="polite"></p>
    <div class="grid grid-cards" id="dishes"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/main.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
